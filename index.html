 PHOTOBOOTH DE SOIRÉE  —  un seul fichier, aucune installation
 © 2026 Max Monneret. Tous droits réservés. Reproduction, copie, modification ou

================================================================================
 OUVRIR
   Double-clic sur ce fichier (Chrome ou Edge). Autorisez la caméra.
   Sans caméra, le mode démo démarre tout seul.

 MODE KIOSQUE + IMPRESSION SILENCIEUSE (imprimante photo DNP, par exemple)
   1. Installez l'imprimante DNP et définissez-la comme imprimante PAR DÉFAUT
      de Windows. Dans ses préférences, choisissez le papier 10x15 (4x6").
   2. Créez un raccourci Chrome avec cette cible (adaptez le chemin du fichier) :

      "C:\Program Files\Google\Chrome\Application\chrome.exe" --kiosk --kiosk-printing --use-fake-ui-for-media-stream --autoplay-policy=no-user-gesture-required "file:///C:/Users/VOUS/Documents/Claude/photobooth.html"

      --kiosk                              plein écran sans barre ni onglets
      --kiosk-printing                     imprime sans boîte de dialogue
      --use-fake-ui-for-media-stream       accepte la caméra automatiquement
      --autoplay-policy=no-user-gesture-required   sons sans geste préalable
   3. Fermez toutes les fenêtres Chrome avant de lancer le raccourci.
      Pour quitter le mode kiosque : Alt + F4.
   4. Pour Edge, remplacez chrome.exe par msedge.exe : les mêmes options existent.

 REFLEX CANON
   Installez « EOS Webcam Utility » : l'appareil apparaît comme une webcam.
   Choisissez-le ensuite dans Administration > Caméra.

 CADRE PERSONNALISÉ
   Administration > Cadres perso > « Ajouter un cadre (PNG) ».
   - PNG avec zone TRANSPARENTE là où les photos doivent apparaître.
   - Photo simple et GIF : image au format 3:2 (ex. 1800 x 1200 px).
   - Photomaton : image au format 1:3 (ex. 600 x 1800 px).
   Le cadre est étiré sur toute l'image. Le nom et la date de la soirée
   s'affichent en bas : laissez donc de la place en bas du cadre.

 PLAN DU FICHIER
   1. Styles (CSS)           9. Cadres dessinés en code
   2. Structure (HTML)      10. Composition des images
   3. Réglages               11. Encodeur GIF
   4. Stockage (IndexedDB)  12. Archive ZIP
   5. Thèmes et fonds        13. Parcours invité
   6. Audio                  14. Impression
   7. Caméra / fausse caméra 15. Administration
   8. Filtres                16. Visite guidée / démarrage

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Syne:wght@400;700&family=Space+Grotesk:wght@400;700&family=Unbounded:wght@400;700&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@400;700&family=DM+Serif+Display&family=Orbitron:wght@400;700&display=swap">
<style>
/* ============================ 1. STYLES ============================ */
:root{--bg1:#12002b;--bg2:#001a3a;--c1:#ff2bd6;--c2:#20e3ff;--c3:#ffe600;--text:#fff;--paper:#0b0220;--btn:#12002b;
  --font:'Righteous','Trebuchet MS',sans-serif;--glass:rgba(255,255,255,.13);--glassb:rgba(255,255,255,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
#capIn{width:100%;background:var(--glass);color:var(--text);border:.3vmin solid var(--glassb);border-radius:.5vmin;padding:10px 16px;min-height:44px;font:inherit;font-size:clamp(1rem,2.4vmin,1.8rem);outline:none}#capIn:focus{border-color:var(--c2)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:var(--font);touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:3vmin;gap:2.4vmin}
.screen.active{display:flex;animation:scr .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes scr{from{opacity:0;transform:scale(.96) translateY(2vmin)}to{opacity:1;transform:none}}
h1,h2{margin:0;text-align:center;text-wrap:balance}
.title{font-size:clamp(2rem,6.4vmin,5rem);line-height:1.05;text-shadow:0 .4vmin 2vmin rgba(0,0,0,.35)}
.sub{font-size:clamp(1.1rem,2.8vmin,2.2rem);opacity:.9;text-align:center}
.btn{background:var(--c1);color:var(--btn);font-size:clamp(1.1rem,2.8vmin,2.3rem);letter-spacing:.14em;text-transform:uppercase;padding:2vmin 5vmin;border-radius:.6vmin;box-shadow:0 1.2vmin 3vmin rgba(0,0,0,.35);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.94) translateY(.5vmin)}
.btn.ghost{background:var(--glass);color:var(--text);border:.3vmin solid var(--glassb);box-shadow:none;backdrop-filter:blur(8px)}
.btn.small{font-size:clamp(1rem,2.2vmin,1.6rem);padding:1.2vmin 3vmin}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;align-items:center}

/* Accueil */
#s-home{gap:2vmin}
.cam-wrap{position:relative;width:min(64vw,calc(58vh*1.5));aspect-ratio:3/2;border-radius:.8vmin;padding:.45vmin;background:linear-gradient(135deg,var(--c1),transparent 42%,var(--c2));box-shadow:0 2vmin 8vmin rgba(0,0,0,.55)}
.livecv{width:100%;height:100%;display:block;border-radius:.5vmin;background:#000;object-fit:cover}
.tap{font-size:clamp(1.2rem,3.2vmin,2.6rem);letter-spacing:.35em;text-transform:uppercase;animation:pulse 2.6s ease-in-out infinite;text-shadow:0 .4vmin 2vmin rgba(0,0,0,.4);text-align:center}
@keyframes pulse{50%{opacity:.35}}
.slide{position:absolute;right:3vmin;bottom:3vmin;width:min(20vw,28vh);aspect-ratio:3/4;transform:rotate(5deg);pointer-events:none}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:.8vmin;border-radius:.6vmin;opacity:0;transition:opacity 1s;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.45)}
.slide img.on{opacity:1}
.corner{position:absolute;bottom:3vmin;display:flex;gap:1.5vmin}
#hot{position:fixed;top:0;right:0;width:13vmin;height:13vmin;z-index:50}

/* Modes */
.modes{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.mode{width:min(28vw,36vh);min-width:230px;aspect-ratio:1/1.1;border-radius:.8vmin;background:var(--glass);border:.2vmin solid var(--glassb);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;font-size:clamp(1.3rem,3.2vmin,2.6rem);color:var(--text);transition:transform .15s,background .2s;padding:2vmin}
.mode:active{transform:scale(.93)}
.mode:hover{background:var(--glassb)}
.mode svg{width:45%;height:45%;stroke:var(--c1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode small{font-size:.55em;opacity:.8;text-align:center}

/* Style */
#s-style{flex-direction:row;gap:4vmin}
.pv{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;height:100%}
#styleCv,#shootCv{max-width:100%;max-height:82vh;border-radius:1.6vmin;box-shadow:0 2vmin 6vmin rgba(0,0,0,.5);background:#000}
.panel{width:min(34vw,520px);display:flex;flex-direction:column;gap:2vmin}
.chips{display:flex;flex-wrap:wrap;gap:1.2vmin}
.chip{background:var(--glass);border:.3vmin solid var(--glassb);border-radius:.5vmin;padding:1.3vmin 2.4vmin;letter-spacing:.06em;font-size:clamp(1rem,2.4vmin,1.8rem);color:var(--text);transition:transform .12s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--c1);color:var(--btn);border-color:transparent;transform:none;font-weight:700}
.lbl{font-size:clamp(1rem,2.4vmin,1.8rem);opacity:.85}
@media (max-aspect-ratio:1/1){#s-style{flex-direction:column}.panel{width:92%}.pv{height:auto}}

/* Prise de vue */
#s-shoot{gap:1.5vmin}
.shootbox{position:relative;display:flex;align-items:center;justify-content:center;max-width:100%}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(42vmin,60vw);color:#fff;pointer-events:none;
  text-shadow:0 0 5vmin var(--c1),0 0 10vmin var(--c2),0 1vmin 0 rgba(0,0,0,.4)}
#count.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.2}}
#shootMsg{font-size:clamp(1.4rem,4vmin,3.2rem);min-height:1.3em;text-align:center}
#flash{position:fixed;inset:0;background:#fff;z-index:80;opacity:0;pointer-events:none}
#flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}

/* Résultat */
#s-result{flex-direction:row;gap:5vmin}
.paper{max-height:88vh;max-width:56vw;display:flex;transform-origin:50% 0;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 2vmin 3vmin rgba(0,0,0,.5))}
.paper img{max-height:88vh;max-width:56vw;display:block;border-radius:.4vmin}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-12deg)}100%{transform:rotate(-2deg)}}
.acts{display:flex;flex-direction:column;gap:2.2vmin;align-items:stretch;min-width:min(30vw,420px)}
.acts .btn{width:100%}
#resIdle{font-size:clamp(.9rem,2vmin,1.5rem);opacity:.75;text-align:center}
@media (max-aspect-ratio:1/1){#s-result{flex-direction:column}.paper,.paper img{max-width:88vw;max-height:52vh}}

/* Admin */
#s-admin{justify-content:flex-start;align-items:stretch;gap:1.5vmin;padding:2vmin 3vmin;font-family:system-ui,'Segoe UI',sans-serif;background:rgba(10,8,25,.92);backdrop-filter:blur(14px)}
#s-admin .head{display:flex;justify-content:space-between;align-items:center;gap:2vmin}
#s-admin h2{font-size:clamp(1.4rem,3.4vmin,2.4rem);text-align:left}
.tabs{display:flex;gap:1vmin;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.1);padding:1.2vmin 2.4vmin;border-radius:1.2vmin;font-size:clamp(.95rem,2vmin,1.4rem)}
.tab.on{background:var(--c1);color:var(--btn);font-weight:700}
#admBody{flex:1;overflow:auto;padding:1vmin .5vmin;font-size:clamp(1rem,2.1vmin,1.5rem)}
.f{display:flex;align-items:center;justify-content:space-between;gap:2vmin;padding:1.3vmin 0;border-bottom:1px solid rgba(255,255,255,.1)}
.f>span{flex:1}
.f small{display:block;opacity:.6;font-size:.8em}
.tg{width:7.5vmin;min-width:56px;height:4vmin;min-height:30px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:.4vmin;left:.4vmin;width:calc(100% * .45);aspect-ratio:1;height:calc(100% - .8vmin);border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--c2)}.tg.on::after{transform:translateX(calc(100% * 1.05))}
.num{display:flex;align-items:center;gap:1.4vmin}
.num button,.mini{background:rgba(255,255,255,.18);border-radius:1vmin;min-width:5.5vmin;height:5.5vmin;font-size:1.2em;padding:0 1.5vmin}
.num b{min-width:4ch;text-align:center}
select,#admBody input[type=text],#admBody input[type=date],#admBody input[type=password],#admBody input[type=number]{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:1vmin;padding:1.1vmin 1.6vmin;font-size:inherit;font-family:inherit;max-width:50vw}
select option{color:#000}
.themebtns{display:flex;gap:1vmin;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.4vmin}
.gi{position:relative;border-radius:1vmin;overflow:hidden;background:#000;aspect-ratio:1}
.gi img{width:100%;height:100%;object-fit:cover}
.gi button{position:absolute;top:.6vmin;right:.6vmin;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:4.2vmin;height:4.2vmin;min-width:30px;min-height:30px}
.gi i{position:absolute;left:.6vmin;bottom:.6vmin;background:rgba(0,0,0,.65);font-style:normal;font-size:.7em;padding:.2vmin .8vmin;border-radius:.6vmin}
.stat{display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.1);border-radius:1.6vmin;padding:2vmin 4vmin;margin:0 1.4vmin 1.4vmin 0}
.stat b{font-size:3.4em;color:var(--c3)}
.danger{background:#d6334a;color:#fff}
.pill{background:rgba(255,255,255,.14);border-radius:99px;padding:.4vmin 1.4vmin;font-size:.8em}
.admcam{width:min(46vw,520px)}

/* PIN */
#pin{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
#pin.on{display:flex}
.pinbox{background:#1c1838;border-radius:3vmin;padding:4vmin;display:flex;flex-direction:column;align-items:center;gap:2.4vmin;color:#fff}
.dots{display:flex;gap:2vmin;height:4vmin}.dots i{width:3.4vmin;height:3.4vmin;border-radius:50%;border:.4vmin solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vmin}
.pad button{width:12vmin;height:12vmin;min-width:64px;min-height:64px;border-radius:50%;background:rgba(255,255,255,.14);font-size:3.6vmin;color:#fff}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-2vmin)}40%,80%{transform:translateX(2vmin)}}

/* Démo, visite, divers */
#demoBar{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:60;background:rgba(255,230,0,.95);color:#222;font:700 clamp(.8rem,1.8vmin,1.2rem) system-ui,sans-serif;padding:.7vmin 2vmin;border-radius:0 0 1.4vmin 1.4vmin;display:none;gap:1.5vmin;align-items:center}
#demoBar.on{display:flex}
#demoBar button{background:#222;color:#fff;border-radius:99px;padding:.5vmin 1.6vmin;font:inherit}
#tour{position:fixed;inset:0;z-index:95;display:none}
#tour.on{display:block}
#hl{position:fixed;border-radius:1.6vmin;box-shadow:0 0 0 200vmax rgba(0,0,0,.66),0 0 0 .5vmin var(--c3);transition:all .35s;pointer-events:none}
#bub{position:fixed;width:min(88vw,520px);background:#fff;color:#222;border-radius:2.2vmin;padding:2.4vmin;font:500 clamp(1rem,2.3vmin,1.5rem)/1.45 system-ui,sans-serif;box-shadow:0 2vmin 6vmin rgba(0,0,0,.5);transition:all .35s}
#bub b{display:block;font-size:.8em;opacity:.55;margin-bottom:.6vmin}
#bub .row{justify-content:flex-end;margin-top:1.6vmin;gap:1vmin}
#bub button{background:#222;color:#fff;border-radius:99px;padding:1vmin 2.4vmin;font:inherit}
#bub button.l{background:#e8e8ee;color:#222}
#toast{position:fixed;left:50%;bottom:4vmin;transform:translate(-50%,10vmin);z-index:92;background:#fff;color:#222;font:600 clamp(1rem,2.2vmin,1.5rem) system-ui,sans-serif;padding:1.4vmin 3vmin;border-radius:99px;opacity:0;transition:all .35s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lightbox{position:fixed;inset:0;z-index:91;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
#lightbox.on{display:flex}#lightbox img{max-width:92vw;max-height:92vh;border-radius:1vmin}
#printSheet{display:none}
@media print{
  html,body{background:#fff!important;overflow:visible!important}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important;position:fixed;inset:0}
  #printSheet img{width:100%;height:100%;object-fit:contain;display:block}
}
</style>
<style id="responsive">
/* ===== Adaptation téléphone / tablette / écran quelconque ===== */
html,body{height:100vh;height:100dvh}
.screen{overflow-x:hidden;overflow-y:auto;justify-content:safe center;overscroll-behavior:contain;
  padding:max(3vmin,env(safe-area-inset-top)) max(3vmin,env(safe-area-inset-right)) max(3vmin,env(safe-area-inset-bottom)) max(3vmin,env(safe-area-inset-left))}
#s-admin{justify-content:flex-start;overflow:hidden}
/* zones tactiles confortables sur tous les écrans */
.btn{min-height:48px;padding-left:max(5vmin,24px);padding-right:max(5vmin,24px)}
.btn.small{min-height:44px;padding-left:max(3vmin,16px);padding-right:max(3vmin,16px)}
.chip{min-height:44px;padding:8px max(2.4vmin,16px)}
.tab{min-height:44px;padding:8px max(2.4vmin,14px)}
.num button,.mini{min-width:44px;height:44px}
#styleCv,#shootCv{max-height:82vh;max-height:82dvh}
.paper,.paper img{max-height:88dvh}
#hot{width:max(13vmin,56px);height:max(13vmin,56px)}

/* Portrait (téléphone debout, tablette verticale) */
@media (max-aspect-ratio:1/1){
  .cam-wrap{width:min(92vw,calc(46dvh*1.5))}
  .slide{display:none}
  .corner{position:static;justify-content:center;flex-wrap:wrap}
  .corner[style]{left:auto!important}
  .modes{flex-direction:column;align-items:center;gap:2vmin;width:100%}
  .mode{width:min(90vw,520px);min-width:0;aspect-ratio:auto;min-height:88px;flex-direction:row;justify-content:flex-start;gap:4vmin;padding:2vmin 4vmin}
  .mode svg{width:56px;height:56px;flex:none}
  .mode small{text-align:left}
  #s-style{gap:2vmin}
  .pv{flex:none;height:auto}
  #styleCv,#shootCv{max-height:38dvh;max-width:92vw}
  .panel{width:min(94vw,560px)}
  .paper,.paper img{max-width:88vw;max-height:48dvh}
  .acts{min-width:0;width:min(92vw,420px)}
  .acts .title{font-size:clamp(1.5rem,7vw,2.6rem)!important}
  .f{flex-wrap:wrap}
  .admcam{width:100%}
  select,#admBody input[type=text],#admBody input[type=date],#admBody input[type=password],#admBody input[type=number]{max-width:100%}
  .stat{padding:12px 20px}
}
/* Paysage bas (téléphone couché) */
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .screen{gap:1.6vmin;padding-top:2vmin;padding-bottom:2vmin}
  .title{font-size:clamp(1.4rem,7vmin,2.6rem)}
  .slide{display:none}
  .cam-wrap{width:min(40vw,calc(50vh*1.5))}
  .mode{min-width:150px;aspect-ratio:auto;min-height:120px;gap:1vmin}
  .mode svg{width:36px;height:36px}
  #s-result{gap:3vmin}
  .acts{min-width:min(34vw,320px);gap:1.4vmin}
  #shootCv{max-height:58dvh}
  #shootMsg{font-size:clamp(1rem,5vmin,1.6rem)}
  #styleCv{max-height:78dvh}
  .pv{height:auto}
  .panel{gap:1vmin;max-height:100%}
  .panel .title{font-size:clamp(1.2rem,6vmin,1.8rem)!important}
  .chip{min-height:38px;padding:4px 14px}
  .btn{min-height:42px}
  .panel{width:min(54vw,560px)}.chip{font-size:.85rem;padding:2px 10px;min-height:34px}.chips{gap:6px}.lbl{font-size:.9rem}#capIn{min-height:36px;padding:4px 12px}
}
/* Très petits écrans */
@media (max-width:380px){
  .btn{letter-spacing:.06em}
  .tap{letter-spacing:.2em}
}
/* Grands écrans / bornes : plafonner pour garder une mise en page lisible */
@media (min-width:2200px){.panel{width:min(34vw,760px)}}
</style>

<body data-theme="gears">
<!-- ============================ 2. STRUCTURE ============================ -->
<canvas id="bg"></canvas>

<section class="screen active" id="s-home">
  <h1 class="title" id="hName"></h1>
  <div class="sub" id="hDate"></div>
  <div class="cam-wrap"><canvas class="livecv" width="960" height="640"></canvas></div>
  <div class="tap">Touchez pour commencer</div>
  <div class="slide"><img alt=""><img alt=""></div>
  <div class="corner" style="left:3vmin">
    <button class="btn ghost small" id="btnDemo">Mode démo</button>

function layoutFor(mode,n,full){
  if(mode==='strip'){
    const W=600,H=1800,m=full?30:40,gap=full?10:20,foot=full?150:200,ph=(H-m-foot-gap*(n-1))/n;
    const rects=[];for(let i=0;i<n;i++)rects.push({x:m,y:m+i*(ph+gap),w:W-2*m,h:ph});
    return {W,H,rects,foot:{x:0,y:H-foot,w:W,h:foot},deco:.45,strip:true};
  }

}

function drawLogo(c,k,x,cy,w){const im=LOGOS[k];if(!im)return;const h=w*im.naturalHeight/im.naturalWidth;c.drawImage(im,x,cy-h/2,w,h)}
function logoFooter(c,L,ink,plate,logo){
  const f=L.foot,l1=(state.caption||S.name||'').toUpperCase(),l2=state.caption?(S.name||'').toUpperCase():fmtDate(S.date),fam="'Space Grotesk','Trebuchet MS',sans-serif";
  c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle=ink;
  if(L.strip){
    const px=40,py=f.y+4,pw=L.W-80,ph=f.h-24;
    if(plate){c.fillStyle='rgba(255,255,255,.96)';c.beginPath();c.roundRect(px,py,pw,ph,10);c.fill();c.fillStyle=ink}
    drawLogo(c,logo,L.W/2-250,py+48,500);
    const t=l1+(l2?'  •  '+l2:'');c.letterSpacing='2px';fitFont(c,t,fam,26,pw-40);c.fillText(t,L.W/2,py+ph-34);
  }else{
    const px=60,py=f.y+10,pw=L.W-120,ph=f.h-30,cy=py+ph/2;
    if(plate){c.fillStyle='rgba(255,255,255,.96)';c.beginPath();c.roundRect(px,py,pw,ph,12);c.fill();c.fillStyle=ink}
    drawLogo(c,logo,px+50,cy,860);
    const tx=px+pw-50-330;c.letterSpacing='3px';
    fitFont(c,l1,fam,38,620);c.fillText(l1,tx,cy-18);
    if(l2){c.letterSpacing='2px';fitFont(c,l2,fam,26,620,'400');c.fillText(l2,tx,cy+24)}
  }
  c.restore();
}
function gearPath(c,x,y,r,n,rot){c.beginPath();const ri=r*.8,st=Math.PI*2/n;for(let i=0;i<n;i++){const a=rot+i*st;[[-.27,ri],[-.15,r],[.15,r],[.27,ri]].forEach(p=>c.lineTo(x+Math.cos(a+p[0]*st*1.6)*p[1],y+Math.sin(a+p[0]*st*1.6)*p[1]))}c.closePath();c.moveTo(x+r*.3,y);c.arc(x,y,r*.3,0,Math.PI*2,true)}
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function star(c,x,y,s){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,r=i%2?s*.22:s;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath();c.fill()}

    c.save();c.strokeStyle='rgba(0,0,0,.38)';c.lineWidth=2*L.deco;L.rects.forEach(r=>{const o=10*L.deco;c.strokeRect(r.x-o,r.y-o,r.w+2*o,r.h+2*o)});c.restore();
    c.save();c.strokeStyle='rgba(0,0,0,.14)';c.lineWidth=2;L.rects.forEach(r=>c.strokeRect(r.x,r.y,r.w,r.h));c.restore()}},
  film:{name:'Pellicule',ink:()=>'#f0a23a',font:"'Courier New',monospace",draw(c,L){

    const hole=(x,y,w,h)=>{c.beginPath();c.roundRect(x,y,w,h,4);c.fill()};

const GIF_PAL=(()=>{const p=new Uint8Array(768);for(let r=0;r<6;r++)for(let g=0;g<7;g++)for(let b=0;b<6;b++){const i=(r*42+g*6+b)*3;p[i]=r*51;p[i+1]=Math.round(g*255/6);p[i+2]=b*51}return p})();

const LZW_DICT=new Int32Array(4096*256);
function lzw(idx,minCode){

  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8}};
  emit(clear);let prefix=idx[0];
  for(let i=1;i<idx.length;i++){const k=idx[i],key=prefix*256+k,f=LZW_DICT[key];
    if(f!==-1){prefix=f;continue}

    else{emit(clear);LZW_DICT.fill(-1);size=minCode+1;next=eoi+1}
    prefix=k}
  emit(prefix);emit(eoi);if(bits>0)out.push(cur&255);return out;
}
async function encodeGif(frames,delayCs,progress){
  const w=frames[0].width,h=frames[0].height,o=[];const u16=v=>o.push(v&255,v>>8&255);
  o.push(...[...'GIF89a'].map(c=>c.charCodeAt(0)));u16(w);u16(h);o.push(0xF7,0,0);for(let i=0;i<768;i++)o.push(GIF_PAL[i]);
  o.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
  for(let f=0;f<frames.length;f++){
    const d=frames[f].getContext('2d').getImageData(0,0,w,h).data,idx=new Uint8Array(w*h);let p=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++,p++){
      const i=p*4,th=(BAYER[(y&3)*4+(x&3)]+.5)/16;
      let t=d[i]/255*5,a=t|0,r=a+(t-a>th?1:0);t=d[i+1]/255*6;a=t|0;const g=a+(t-a>th?1:0);t=d[i+2]/255*5;a=t|0;const b=a+(t-a>th?1:0);
      idx[p]=(r>5?5:r)*42+(g>6?6:g)*6+(b>5?5:b)}

}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,time,true);lh.setUint16(12,date,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,time,true);ch.setUint16(14,date,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);

async function runShoot(){
  state.abort=false;state.grabs=[];const mode=state.mode,full=isCustom(state.frame),n=nCells();
  const cv=$('#shootCv');cv.width=mode==='strip'?300:900;cv.height=mode==='strip'?900:600;
  const L=layoutFor(mode,n,full),msg=$('#shootMsg'),poses=shuffle(POSES);

      msg.textContent='Préparez-vous à bouger !';if(!await countdown(S.countdown))return abortShoot();
      msg.textContent='Bougez !';const sc=.4,r=L.rects[0],frames=[];
      for(let i=0;i<12;i++){if(state.abort)return abortShoot();frames.push(grabCell(r.w*sc,r.h*sc));beep(500+i*40,.04,'square',.08);await sleep(140)}
      flash();state.poster=grabCell(r.w,r.h);state.gifFrames=frames;
    }else{

        msg.textContent=n>1?`Photo ${i+1} sur ${n}  •  ${poses[i%poses.length]}`:'Souriez !';
        if(!await countdown(i===0?S.countdown:Math.min(S.countdown,3)))return abortShoot();
        flash();const r=L.rects[i];state.grabs[i]=grabCell(r.w,r.h);confetti(innerWidth/2,innerHeight/2,50);

async function finalize(){
  const mode=state.mode;let item,url;
  if(mode==='gif'){
    const msg=$('#shootMsg'),fr=state.gifFrames,sc=.4;
    const comp=fr.map(g=>composeFinal([g],'single',state.frame,sc));
    const seq=[...comp,...comp.slice(1,-1).reverse()];
    const blob=await encodeGif(seq,9,(a,b)=>{msg.textContent=`Création du GIF… ${Math.round(a/b*100)}%`});
    const poster=composeFinal([state.poster],'single',state.frame,1),pb=await toBlob(poster);
    item={type:'gif',ts:Date.now(),blob,poster:pb,thumb:await thumbOf(poster)};S.stats.gifs++;
  }else{
    const cv=composeFinal(state.grabs,mode,state.frame,1),blob=await toBlob(cv);
    item={type:mode==='strip'?'strip':'photo',ts:Date.now(),blob,thumb:await thumbOf(cv)};
    if(mode==='strip')S.stats.strips++;else S.stats.photos++;
  }
  save();try{item.id=await DB.add('photos',item)}catch(e){toast('Galerie pleine ou indisponible : la photo n\'est pas archivée.')}

}

  b.append(g);if(!all.length){const p=document.createElement('p');p.style.opacity='.7';p.textContent='La galerie est vide pour le moment.';b.append(p)}
}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('on');
function armBtn(btn,label,fn){let armed=false;btn.onclick=()=>{if(!armed){armed=true;btn.textContent='Confirmer ?';setTimeout(()=>{armed=false;btn.textContent=label},3000);return}armed=false;btn.textContent=label;fn()}}
async function tStats(b){
  const n=(await DB.all('photos')).length;
  const s=document.createElement('div');[['Photos',S.stats.photos],['Photomatons',S.stats.strips],['GIF',S.stats.gifs],['Impressions',S.stats.prints],['En galerie',n]].forEach(([l,v])=>{const d=document.createElement('div');d.className='stat';d.innerHTML=`<b>${v}</b><span>${l}</span>`;s.appendChild(d)});b.append(s);
  const r1=document.createElement('button');r1.className='tab danger';r1.textContent='Réinitialiser la soirée';armBtn(r1,'Réinitialiser la soirée',async()=>{await DB.clear('photos');S.stats={photos:0,strips:0,gifs:0,prints:0};save();toast('Soirée réinitialisée.');renderAdmin()});
  const r2=document.createElement('button');r2.className='tab danger';r2.textContent='Réglages par défaut';armBtn(r2,'Réglages par défaut',()=>{const frames=S.frames;S=deepMerge(DEFAULTS,{});save();applyTheme('noir');toast('Réglages restaurés.');renderAdmin()});
  b.append(field('Effacer photos et compteurs',r1,'Les réglages sont conservés.'),field('Remettre les réglages d\'usine',r2,'Les photos sont conservées.'));
}
async function loadCustom(){
  customList=await DB.all('frames');customVer++;layerCache.clear();
  await Promise.all(customList.map(c=>new Promise(res=>{const im=new Image();im.onload=()=>{customImgs[c.id]=im;res()};im.onerror=res;im.src=URL.createObjectURL(c.blob)})));
}

/* ====================== 16. VISITE GUIDÉE ET DÉMARRAGE ====================== */
const TOUR=[
  {screen:'home',sel:'.cam-wrap',t:'Bienvenue ! L\'accueil montre la caméra en direct. Ici, c\'est une fausse caméra de démonstration. En bas à droite, un diaporama affiche les dernières photos de la soirée.'},
  {screen:'home',sel:'#btnDemo',t:'Ce bouton relance cette visite à tout moment. Le bouton « Son » active ou coupe les bips et le déclencheur.'},
  {screen:'home',sel:'#hot',t:'Zone secrète : un appui long de 2 secondes dans ce coin (en haut à droite) ouvre le code PIN, puis l\'administration. Code par défaut : 1234.'},
  {screen:'mode',sel:'#modeList',t:'L\'invité choisit son mode : photo simple, photomaton (bande verticale de plusieurs photos enchaînées) ou GIF animé façon boomerang.'},
  {screen:'style',mode:'strip',sel:'#styleCv',t:'Aperçu en direct : voici une bande de photomaton. Chaque case montre la caméra, avec le cadre, le nom et la date de la soirée.'},
  {screen:'style',mode:'strip',sel:'#frameChips',t:'Les cadres : touchez-en un pour voir le résultat immédiatement. Vous pouvez aussi importer vos propres cadres PNG.',act:async()=>{const c=$$('#frameChips .chip');if(c[1])c[1].click()}},
  {screen:'style',mode:'strip',sel:'#filterChips',t:'Les filtres : noir et blanc, vintage, pop, chaud, froid. L\'aperçu change en direct.',act:async()=>{const c=$$('#filterChips .chip');if(c[2])c[2].click()}},
  {run:true,t:'Compte à rebours géant, flash, confettis : voici le résultat, composé avec le cadre, le nom et la date. Photo prise automatiquement pour la démo.',sel:'.paper'},
  {screen:'result',sel:'#resActions',t:'L\'invité peut imprimer (nombre limité par invité), télécharger ou recommencer. Sans action, retour automatique à l\'accueil après 30 s.'},
  {admin:'general',sel:'#themeBtns',t:'Dix thèmes changent couleurs, typo, fond animé et cadre assorti. Regardez : le thème change tout seul.',act:async()=>{const o=S.theme,ks=Object.keys(THEMES),mark=id=>$$('#themeBtns button').forEach((x,i)=>x.classList.toggle('on',ks[i]===id));for(const id of ks){applyTheme(id);mark(id);await sleep(1300)}applyTheme(o);mark(o)}},
  {admin:'modes',sel:'#admBody',t:'Choisissez les modes, cadres et filtres proposés aux invités. Gardez-en au moins un de chaque.'},
  {admin:'time',sel:'#admBody',t:'Durée du compte à rebours, nombre de photos de la bande, délai de retour à l\'accueil.'},
  {admin:'camera',sel:'#admBody',t:'Choix de la caméra (reflex Canon via EOS Webcam Utility), résolution et effet miroir.'},
  {admin:'print',sel:'#admBody',t:'Impression : activation, format 10x15 ou bande 5x15, maximum par invité, page de test. Pour imprimer sans dialogue, lancez Chrome avec --kiosk-printing (voir le début du fichier).'},
  {admin:'frames',sel:'#admBody',t:'Importez vos cadres PNG transparents ici.'},
  {admin:'gallery',sel:'#admBody',t:'La galerie de la soirée : voir, supprimer, ou tout télécharger en ZIP.'},
  {admin:'stats',sel:'#admBody',t:'Statistiques de la soirée, remise à zéro et réglages d\'usine.'},
  {screen:'home',center:true,t:'C\'est tout ! Touchez l\'écran pour tester vous-même. Le bandeau jaune « Mode démo » en haut permet de quitter la démo.'}
];
let tourI=0;
async function startTour(){tourActive=true;tourI=0;state.result=null;$('#tour').classList.add('on');await showStep()}
async function showStep(){
  const s=TOUR[tourI],bub=$('#bub');bub.style.opacity=0;$('#hl').style.opacity=0;
  if(s.admin){go('admin');admTab=s.admin;renderAdmin()}
  else if(s.run){state.mode='single';state.frame=activeFrames()[0];state.filter='none';go('shoot');await runShoot()}
  else if(s.screen){if(s.mode)state.mode=s.mode;if(s.screen==='result'&&!state.result){state.mode='single';go('shoot');await runShoot()}else go(s.screen)}
  await sleep(450);if(!tourActive)return;
  if(s.act)s.act();
  const t=$(s.sel||'body');const r=s.center||!t?null:t.getBoundingClientRect();
  const hl=$('#hl');
  if(r){const p=6;Object.assign(hl.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px',opacity:1})}
  else Object.assign(hl.style,{left:'50%',top:'50%',width:'0',height:'0',opacity:0});
  bub.innerHTML=`<b>Étape ${tourI+1} sur ${TOUR.length}</b>${s.t}<div class="row"><button class="l" id="tQ">Quitter</button>${tourI?'<button class="l" id="tP">Précédent</button>':''}<button id="tN">${tourI<TOUR.length-1?'Suivant':'Terminer'}</button></div>`;
  bub.style.opacity=1;
  const bh=bub.offsetHeight,bw=bub.offsetWidth;let x=(innerWidth-bw)/2,y=(innerHeight-bh)/2;
  if(r){y=r.bottom+20+bh<innerHeight?r.bottom+20:(r.top-bh-20>8?r.top-bh-20:Math.max(8,innerHeight-bh-12));x=Math.min(Math.max(8,r.left+r.width/2-bw/2),innerWidth-bw-8)}
  bub.style.left=x+'px';bub.style.top=y+'px';
  $('#tN').onclick=()=>{if(tourI<TOUR.length-1){tourI++;showStep()}else endTour()};
  const pb=$('#tP');if(pb)pb.onclick=()=>{tourI--;showStep()};
  $('#tQ').onclick=endTour;
}
function endTour(){tourActive=false;$('#tour').classList.remove('on');go('home')}
addEventListener('resize',()=>{if(tourActive)showStep()});

/* --- boucle principale --- */
let lastBg=0;
function loop(t){
  requestAnimationFrame(loop);
  if(demo||!camOK)drawFake(t);
  if(t-lastBg>33){drawBg(t);lastBg=t}
  const act=$('.screen.active');if(!act)return;
  if(cur==='style')drawPreview($('#styleCv'));
  else if(cur==='shoot')drawPreview($('#shootCv'),state.mode==='strip'?state.grabs:null);
  else $$('.livecv',act).forEach(cv=>{const c=cv.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);drawCover(c,cam.el,cam.w,cam.h,0,0,cv.width,cv.height,S.mirror&&!(demo||!camOK))});
}
(async function init(){
  await DB.open();await loadCustom();applyTheme(S.theme);refreshHome();requestAnimationFrame(loop);
  const ok=await startCamera();
  if(!ok){setDemo(true,true);toast('Aucune caméra détectée : mode démo activé.',5000)}
  onHome();
})();
</script>
